<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MaaS Portal</title>

<meta name="theme-color" content="#111111">

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
}

header{
  padding:18px;
  border-bottom:1px solid #222;
}

h1{
  margin:0;
  font-size:20px;
}

.sub{
  margin-top:6px;
  color:#aaa;
  font-size:13px;
}

.search{
  display:flex;
  gap:8px;
  padding:16px;
}

input{
  flex:1;
  height:42px;
  border:none;
  border-radius:12px;
  background:#151515;
  color:white;
  padding:0 14px;
  font-size:14px;
}

button{
  border:none;
  border-radius:12px;
  background:#242424;
  color:white;
  padding:0 16px;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:0 16px 16px;
}

.card{
  display:block;
  background:#141414;
  border:1px solid #222;
  border-radius:16px;
  padding:16px;
  color:white;
  text-decoration:none;
}

.card:hover{
  border-color:#444;
}

.title{
  font-size:15px;
  margin-bottom:6px;
}

.desc{
  font-size:12px;
  color:#aaa;
  line-height:1.35;
}
</style>
</head>

<body>

<header>
  <h1>MaaS Portal</h1>

  <div class="sub">
    Lightweight launcher for allowed services
  </div>
</header>

<div class="search">
  <input id="q" placeholder="Search or type URL">
  <button id="go">Go</button>
</div>

<div class="grid">

  <div class="card" data-url="https://animotvslash.org/">
    <p class="title">AnimoTVSlash</p>
    <p class="desc">Loads inside this page (may be blocked by policy)</p>
  </div>

  <a class="card" href="https://drive.google.com/" target="_blank">
    <div class="title">Google Drive</div>
    <div class="desc">
      Files, videos and media
    </div>
  </a>

  <a class="card" href="https://docs.google.com/" target="_blank">
    <div class="title">Google Docs</div>
    <div class="desc">
      Docs, Sheets and Slides
    </div>
  </a>

  <a class="card" href="https://github.com/" target="_blank">
    <div class="title">GitHub</div>
    <div class="desc">
      Repositories and Pages
    </div>
  </a>

  <a class="card" href="https://www.google.com/" target="_blank">
    <div class="title">Google</div>
    <div class="desc">
      Search engine
    </div>
  </a>

</div>

<script>
const q = document.getElementById("q");
const go = document.getElementById("go");

function normalize(v){
  v = (v || "").trim();

  if(!v) return null;

  if(v.includes(".") && !v.includes(" ")){
    return v.startsWith("http")
      ? v
      : "https://" + v;
  }

  return "https://www.google.com/search?q=" + encodeURIComponent(v);
}

go.onclick = () => {
  const url = normalize(q.value);
  if(url) window.open(url, "_blank");
};

q.addEventListener("keydown", e => {
  if(e.key === "Enter") go.click();
});
</script>

</body>
</html>
